name: Fetch Meta docs

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 07:30 WIB, daily (before the Claude task)
  workflow_dispatch:        # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:
  group: fetch-meta-docs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download pages
        run: python3 fetch.py

      - name: Save exact diff and commit
        run: |
          git config user.name "meta-docs-monitor"
          git config user.email "meta-docs-monitor@users.noreply.github.com"
          # Show the nearest markdown heading with every change
          echo "*.md diff=markdown" > .git/info/attributes
          git add -A pages
          git diff --cached --no-color --function-context -- pages > reports/latest.diff
          # Keep a dated history (skipped for the first, baseline run)
          DAY=$(TZ=Asia/Jakarta date +%F)
          if [ -s reports/latest.diff ] && ! grep -q '"baseline": true' reports/status.json; then
            cat reports/latest.diff >> "reports/history/$DAY.diff"
            grep -qx "$DAY.diff" reports/history/index.txt 2>/dev/null || echo "$DAY.diff" >> reports/history/index.txt
          fi
          git add -A pages reports
          git commit -m "Docs snapshot $(TZ=Asia/Jakarta date '+%F %H:%M') WIB" || echo "Nothing to commit"
          git push
